<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Gallery | Hotel Chandikhol</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>


    <div class="top-bar">

        <p>
            <i class="fa-solid fa-utensils"></i>
            Good Food. Good People. Good Memories.
        </p>

    </div>


    <header class="site-header">

        <div class="navbar">

            <a href="index.html" class="logo">
                <img src="images/logo.png"
                     alt="Hotel Chandikhol">
            </a>


            <input type="checkbox" id="menu-toggle">

            <label for="menu-toggle" class="menu-icon">
                <i class="fa-solid fa-bars"></i>
            </label>


            <nav class="nav-menu">

                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>

                <a href="about.html">
                    <i class="fa-solid fa-hotel"></i>
                    About Hotel
                </a>

                <a href="owner.html">
                    <i class="fa-solid fa-user-tie"></i>
                    About Owner
                </a>

                <a href="menu.html">
                    <i class="fa-solid fa-bowl-food"></i>
                    Menu
                </a>

                <a href="gallery.html" class="active">
                    <i class="fa-solid fa-images"></i>
                    Gallery
                </a>

                <a href="contact.html">
                    <i class="fa-solid fa-phone"></i>
                    Contact
                </a>
                <a href="offers.html">
                    <i class="fa-solid fa-phone"></i>
                    Offers
                </a>


                <div class="social-links">

                    <a href="https://www.instagram.com/hotel.chandikhol/"
                       target="_blank">
                        <i class="fa-brands fa-instagram"></i>
                    </a>

                    <a href="https://www.youtube.com/@hotelchandikhol"
                       target="_blank">
                        <i class="fa-brands fa-youtube"></i>
                    </a>

                </div>

            </nav>

        </div>

    </header>


    <section class="page-hero">

        <div>

            <span>OUR MEMORIES</span>

            <h1>
                Hotel
                <strong>Gallery</strong>
            </h1>

            <p>
                A glimpse of our food, place and moments.
            </p>

        </div>

    </section>


    <section class="gallery-section section">

        <div class="section-heading">

            <span>EXPLORE</span>

            <h2>
                Our <strong>Gallery</strong>
            </h2>

        </div>


        <div class="gallery-grid">

            <div class="gallery-item">

                <img src="images/gallery/gallery1.jpg"
                     alt="Hotel Chandikhol">

                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>

            </div>


            <div class="gallery-item">

                <img src="images/gallery/gallery2.jpg"
                     alt="Restaurant Food">

                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>

            </div>


            <div class="gallery-item">

                <img src="images/gallery/gallery3.jpg"
                     alt="Delicious Food">

                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>

            </div>


            <div class="gallery-item">

                <img src="images/gallery/gallery4.jpg"
                     alt="Restaurant">

                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>

            </div>


            <div class="gallery-item">

                <img src="images/gallery/gallery5.jpg"
                     alt="Food">

                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>

            </div>


            <div class="gallery-item">

                <img src="images/gallery/gallery6.jpg"
                     alt="Hotel Chandikhol Food">

                <div class="gallery-overlay">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </div>

            </div>

        </div>

    </section>


    <footer class="footer">

        <div class="copyright">

            <p>
                © 2026 Hotel Chandikhol. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="js/main.js"></script>

</body>

</html>
